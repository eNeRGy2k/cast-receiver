<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KoreStream Ultra Receiver - v1.2.0-SAFE</title>
    <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <style>
        #app-version {
            position: absolute;
            top: 12px;
            right: 15px;
            background: rgba(0, 0, 0, 0.75);
            color: #00ffcc;
            font-family: monospace;
            font-size: 14px;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid rgba(0, 255, 204, 0.4);
            z-index: 999999;
            pointer-events: none;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body style="margin: 0; background: #000; overflow: hidden; width: 100vw; height: 100vh;">

    <cast-media-player></cast-media-player>
    <div id="app-version">KoreStream Receiver v1.2.0-SAFE</div>

    <script>
        // =====================================================================
        // KORESTREAM v1.2.0-SAFE - ARQUITECTURA SEGURA PARA PRODUCCIÓN
        // =====================================================================
        // CORRECCIONES CRÍTICAS POSTERIORES A REVISIÓN:
        // - AC-3 purga OBLIGATORIA en dispositivos limitados
        // - STPP: eliminar en Shaka viejo, mantener en nuevo
        // - LIVE detection: MPD@type, no URL sniffing
        // - User-agent + isTypeSupported() en combinación
        // - BUCLE DE NIEBLA: Reintentos automáticos con contador
        // =====================================================================

        const RECEIVER_VERSION = 'v1.2.0-SAFE';
        const CUSTOM_CHANNEL = 'urn:x-cast:com.equisde.korestream';
        console.log(`[KoreStream] Iniciando Receiver ${RECEIVER_VERSION}`);

        // =====================================================================
        // DEVICE DETECTION CON VALIDACIÓN DUAL
        // =====================================================================
        const DEVICE_TYPE = {
            NEST_HUB: 'nest_hub',
            SHIELD: 'nvidia_shield',
            CHROMECAST_ULTRA: 'chromecast_ultra',
            ANDROID_TV: 'android_tv',
            GENERIC: 'generic'
        };

        function detectDevice() {
            const ua = navigator.userAgent.toLowerCase();
            
            if (ua.includes('shield') || ua.includes('nvsl')) {
                console.log('[DEVICE] Detectado: NVIDIA Shield');
                return DEVICE_TYPE.SHIELD;
            }
            if (ua.includes('nest hub') || ua.includes('fuchsia')) {
                console.log('[DEVICE] Detectado: Google Nest Hub (RECURSOS LIMITADOS)');
                return DEVICE_TYPE.NEST_HUB;
            }
            if (ua.includes('android tv') || ua.includes('googletv')) {
                console.log('[DEVICE] Detectado: Android TV');
                return DEVICE_TYPE.ANDROID_TV;
            }
            if (ua.includes('chromecast')) {
                console.log('[DEVICE] Detectado: Chromecast (versión desconocida)');
                return DEVICE_TYPE.CHROMECAST_ULTRA;
            }
            
            console.log('[DEVICE] Dispositivo genérico/desconocido');
            return DEVICE_TYPE.GENERIC;
        }

        const CURRENT_DEVICE = detectDevice();

        // =====================================================================
        // CODEC PREFERENCES CON VALIDACIÓN VIA MediaSource.isTypeSupported()
        // =====================================================================
        // CAMBIO CRÍTICO: No solo user-agent, TAMBIÉN validar con isTypeSupported()
        // =====================================================================
        
        function validateCodecsWithMSE(codecs) {
            return codecs.filter(codec => {
                try {
                    // Validar si el navegador (en este dispositivo) soporta el codec
                    const isSupported = MediaSource.isTypeSupported(
                        `video/mp4; codecs="${codec}"`
                    );
                    console.log(`[CODEC-VALIDATION] ${codec}: ${isSupported ? 'SOPORTADO' : 'NO SOPORTADO'}`);
                    return isSupported;
                } catch (e) {
                    console.warn(`[CODEC-VALIDATION] Error validando ${codec}:`, e);
                    return false;
                }
            });
        }

        function getVideoCodecPreferences(device) {
            let preferred;
            
            switch(device) {
                case DEVICE_TYPE.NEST_HUB:
                    preferred = ['avc1', 'h264'];
                    break;
                case DEVICE_TYPE.SHIELD:
                    preferred = ['av01', 'hev1', 'vp9', 'avc1', 'h264'];
                    break;
                case DEVICE_TYPE.CHROMECAST_ULTRA:
                    preferred = ['vp9', 'avc1', 'h264'];
                    break;
                case DEVICE_TYPE.ANDROID_TV:
                    preferred = ['vp9', 'hev1', 'avc1', 'h264'];
                    break;
                default:
                    preferred = ['vp9', 'avc1', 'h264'];
            }
            
            // VALIDAR cada codec contra capabilities reales del dispositivo
            return validateCodecsWithMSE(preferred);
        }

        function getAudioCodecPreferences(device) {
            // AAC es universal. AC-3/E-AC-3 se filtran en manifest, no aquí.
            return ['mp4a.40.2', 'mp4a.40.5', 'mp4a', 'aac'];
        }

        // =====================================================================
        // UTILITY FUNCTIONS
        // =====================================================================
        
        function hexToBase64Url(hexStr) {
            const cleanHex = hexStr.replace(/[^a-fA-F0-9]/g, '');
            const bytes = new Uint8Array(cleanHex.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
            let binary = '';
            for (let i = 0; i < bytes.byteLength; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        function formatKidToUuid(hexKid) {
            const clean = hexKid.replace(/[^a-fA-F0-9]/g, '').toLowerCase();
            if (clean.length !== 32) return hexKid;
            return `${clean.slice(0,8)}-${clean.slice(8,12)}-${clean.slice(12,16)}-${clean.slice(16,20)}-${clean.slice(20)}`;
        }

        // =====================================================================
        // DETECCIÓN DE LIVE vs VOD - VIA MANIFEST, NO URL
        // =====================================================================
        // CAMBIO CRÍTICO: Parsear MPD@type, no URL sniffing
        // =====================================================================
        
        function detectStreamTypeFromManifest(xmlDoc) {
            const mpdNode = xmlDoc.getElementsByTagName('MPD')[0];
            if (mpdNode) {
                const mpdType = mpdNode.getAttribute('type');
                if (mpdType === 'dynamic') {
                    console.log('[STREAM-TYPE] LIVE detectado via MPD@type=dynamic (estándar DASH)');
                    return 'live';
                }
                if (mpdType === 'static') {
                    console.log('[STREAM-TYPE] VOD detectado via MPD@type=static (estándar DASH)');
                    return 'vod';
                }
            }
            console.warn('[STREAM-TYPE] MPD@type no encontrado, asumiendo VOD');
            return 'vod';
        }

        // =====================================================================
        // CONTEXTO Y CONFIGURACIÓN GLOBAL
        // =====================================================================
        
        const context = cast.framework.CastReceiverContext.getInstance();
        const playerManager = context.getPlayerManager();
        let activeCustomData = {};
        let isErrorLoopActive = false;
        let currentStreamType = 'vod';  // Cache del tipo de stream
        
        // =====================================================================
        // BUCLE DE NIEBLA - Variables de control
        // =====================================================================
        let fogLoopRetries = 0;
        const MAX_FOG_LOOP_RETRIES = 10;  // Máximo 10 reintentos
        let fogLoopTimeout = null;

        function notifySenderFatalError(reason, code) {
            try {
                context.sendCustomMessage(CUSTOM_CHANNEL, undefined, {
                    type: 'FATAL_ERROR',
                    reason: reason,
                    code: code
                });
            } catch (e) {
                console.warn('[CustomChannel] Error enviando mensaje:', e);
            }
        }

        // =====================================================================
        // NVIDIA SHIELD PATCH
        // =====================================================================
        playerManager.setMessageInterceptor(cast.framework.messages.MessageType.LOAD, loadRequestData => {
            console.log('[KoreStream] Nueva carga. Limpiando estado...');
            activeCustomData = {};
            isErrorLoopActive = false;
            currentStreamType = 'vod';
            fogLoopRetries = 0;  // RESET contador de reintentos
            
            // Limpiar timeout previo si existe
            if (fogLoopTimeout) {
                clearTimeout(fogLoopTimeout);
                fogLoopTimeout = null;
            }
            
            const videoElement = document.querySelector('video');
            if (videoElement) {
                videoElement.loop = false;
            }
            return loadRequestData;
        });

        // =====================================================================
        // CONFIGURACIÓN DE REPRODUCCIÓN
        // =====================================================================
        
        const playbackConfig = new cast.framework.PlaybackConfig();

        playbackConfig.shakaConfiguration = {
            abr: { 
                enabled: false,  // Mantener deshabilitado por seguridad
                defaultBandwidthEstimate: 5000000
            },
            
            streaming: {
                jumpLargeGaps: true,
                liveIgnoreNtp: true,
                bufferingGoal: 4,
                rebufferingGoal: 2,
                stallEnabled: true,
                preferLiveSegments: false,
                retryParameters: { maxAttempts: 3, timeout: 8000 }
            },
            
            manifest: {
                hls: { ignoreTextStreamFailures: true, allowInsecureScheme: true },
                dash: { ignoreMinBufferTime: true, autoCorrectDrift: true },
                retryParameters: { maxAttempts: 5, timeout: 10000 }
            },
            
            drm: {
                clearKeys: {},
                servers: {},
                retryParameters: { maxAttempts: 2, timeout: 15000 }
            },
            
            preferredAudioCodecs: getAudioCodecPreferences(CURRENT_DEVICE),
            preferredVideoCodecs: getVideoCodecPreferences(CURRENT_DEVICE),
            preferredAudioChannelCount: 2,
            preferFewerChannels: true
        };

        // =====================================================================
        // MANIFEST REQUEST HANDLER - PURGA SEGURA DE CODECS
        // =====================================================================
        // CAMBIOS CRÍTICOS:
        // 1. AC-3/E-AC-3: OBLIGATORIA en Nest Hub/Chromecast v3
        // 2. STPP: Eliminar solo en Shaka viejo
        // =====================================================================
        
        playbackConfig.manifestRequestHandler = (requestInfo) => {
            requestInfo.withCredentials = false;

            if (activeCustomData && activeCustomData.headers) {
                requestInfo.headers = Object.assign({}, requestInfo.headers, activeCustomData.headers);
            }

            if (!requestInfo.url.includes('.mpd') && !requestInfo.url.includes('dash')) {
                return requestInfo;
            }

            const originalModifyResponse = requestInfo.modifyResponse;
            requestInfo.modifyResponse = (response) => {
                if (originalModifyResponse) originalModifyResponse(response);

                try {
                    const rawXml = new TextDecoder('utf-8').decode(response.data);
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(rawXml, 'application/xml');

                    // ============================================================
                    // DETECTAR TIPO DE STREAM (LIVE vs VOD)
                    // ============================================================
                    currentStreamType = detectStreamTypeFromManifest(xmlDoc);

                    const mpdNode = xmlDoc.getElementsByTagName('MPD')[0];
                    if (mpdNode) {
                        const ast = mpdNode.getAttribute('availabilityStartTime') || '';
                        const periodNode = xmlDoc.getElementsByTagName('Period')[0];
                        const periodStart = periodNode ? (periodNode.getAttribute('start') || '') : '';
                        
                        const hasEpochPeriodStart = periodStart && !periodStart.startsWith('PT0S') && !periodStart.startsWith('PT0.000S');
                        const hasAbsoluteTimeline = xmlDoc.querySelector('SegmentTimeline S[t]');

                        if (!hasEpochPeriodStart && !hasAbsoluteTimeline) {
                            if (ast.startsWith('1970') || ast.startsWith('1900') || ast.startsWith('2015') || !ast) {
                                const pubTimeStr = mpdNode.getAttribute('publishTime');
                                const pubDate = pubTimeStr ? new Date(pubTimeStr) : new Date();
                                const newAst = new Date(pubDate.getTime() - 120000).toISOString();
                                mpdNode.setAttribute('availabilityStartTime', newAst);
                            }
                        }

                        const utcTimings = Array.from(xmlDoc.getElementsByTagName('UTCTiming'));
                        utcTimings.forEach(ut => ut.parentNode.removeChild(ut));

                        mpdNode.setAttribute('minBufferTime', 'PT2S');
                        const currentBuffer = mpdNode.getAttribute('timeShiftBufferDepth');
                        if (!currentBuffer || currentBuffer.includes('PT30S') || currentBuffer.includes('PT22S')) {
                            mpdNode.setAttribute('timeShiftBufferDepth', 'PT60S');
                        }
                    }

                    // ============================================================
                    // SUBTÍTULOS - Eliminar STPP SOLO en Shaka viejo
                    // ============================================================
                    const shakaVersion = shaka.Player.version || '3.0.0';
                    const shakaMajor = parseInt(shakaVersion.split('.')[0]);
                    const shakaMinor = parseInt(shakaVersion.split('.')[1]);
                    const isShakaOld = shakaMajor < 3 || (shakaMajor === 3 && shakaMinor < 2);

                    if (isShakaOld) {
                        console.log(`[SUBTITLE] Shaka ${shakaVersion} detectado (VIEJO). Removiendo STPP por seguridad...`);
                        const textAdaptationSets = Array.from(xmlDoc.getElementsByTagName('AdaptationSet')).filter(as => 
                            as.getAttribute('contentType') === 'text' || 
                            as.querySelector('Representation[codecs="stpp"]')
                        );
                        textAdaptationSets.forEach(as => as.parentNode.removeChild(as));
                    } else {
                        console.log(`[SUBTITLE] Shaka ${shakaVersion} detectado (MODERNO). Permitiendo STPP...`);
                    }

                    // ============================================================
                    // DRM HANDLING
                    // ============================================================
                    const clearKeys = activeCustomData.clearKeys || {};
                    const keyIds = Object.keys(clearKeys);
                    const isClearKeyStream = keyIds.length > 0;
                    const firstKid = isClearKeyStream ? keyIds[0] : null;
                    const uuidKid = firstKid ? formatKidToUuid(firstKid) : null;

                    const contentProtections = Array.from(xmlDoc.getElementsByTagName('ContentProtection'));
                    contentProtections.forEach(cp => {
                        const scheme = (cp.getAttribute('schemeIdUri') || '').toLowerCase();
                        
                        if (isClearKeyStream) {
                            const isToPurge = scheme.includes('edef8ba9') || scheme.includes('9a04f079') ||
                                              scheme.includes('adb41c24') || scheme.includes('adb90c1d') ||
                                              scheme.includes('8043001d') || scheme.includes('1077efec') ||
                                              scheme.includes('widevine') || scheme.includes('playready') ||
                                              scheme.includes('nagra');

                            if (isToPurge) {
                                cp.parentNode.removeChild(cp);
                                return;
                            }
                            const psshNodes = cp.getElementsByTagName('cenc:pssh');
                            Array.from(psshNodes).forEach(p => p.parentNode.removeChild(p));
                        } else {
                            const isUnsupportedDrm = scheme.includes('9a04f079') || scheme.includes('adb41c24') ||
                                                    scheme.includes('adb90c1d') || scheme.includes('playready') ||
                                                    scheme.includes('nagra');
                            if (isUnsupportedDrm) {
                                cp.parentNode.removeChild(cp);
                            }
                        }
                    });

                    if (isClearKeyStream && uuidKid) {
                        const adaptationSets = xmlDoc.getElementsByTagName('AdaptationSet');
                        Array.from(adaptationSets).forEach(as => {
                            let mp4Prot = Array.from(as.getElementsByTagName('ContentProtection')).find(cp => 
                                (cp.getAttribute('schemeIdUri') || '').includes('urn:mpeg:dash:mp4protection:2011')
                            );
                            if (!mp4Prot) {
                                mp4Prot = xmlDoc.createElement('ContentProtection');
                                mp4Prot.setAttribute('schemeIdUri', 'urn:mpeg:dash:mp4protection:2011');
                                mp4Prot.setAttribute('value', 'cenc');
                                as.insertBefore(mp4Prot, as.firstChild);
                            }
                            mp4Prot.setAttribute('cenc:default_KID', uuidKid);
                        });
                    }

                    // ============================================================
                    // AUDIO - PURGA SEGURA DE AC-3 EN DISPOSITIVOS LIMITADOS
                    // ============================================================
                    // CAMBIO CRÍTICO: Eliminar AC-3 OBLIGATORIAMENTE en Nest Hub
                    // ============================================================
                    const audioAdaptationSets = Array.from(xmlDoc.getElementsByTagName('AdaptationSet')).filter(as => 
                        (as.getAttribute('contentType') === 'audio' || (as.getAttribute('mimeType') || '').startsWith('audio'))
                    );

                    audioAdaptationSets.forEach(as => {
                        const representations = Array.from(as.getElementsByTagName('Representation'));
                        
                        // En Nest Hub y Chromecast viejo: PURGA OBLIGATORIA
                        if (CURRENT_DEVICE === DEVICE_TYPE.NEST_HUB || 
                            CURRENT_DEVICE === DEVICE_TYPE.CHROMECAST_ULTRA) {
                            console.log('[AUDIO] Dispositivo limitado detectado. Removiendo AC-3/E-AC-3 por seguridad del kernel...');
                            representations.forEach(rep => {
                                const codecs = (rep.getAttribute('codecs') || '').toLowerCase();
                                const mime = (rep.getAttribute('mimeType') || '').toLowerCase();
                                if (codecs.includes('ac-3') || codecs.includes('ec-3') || codecs.includes('eac3') || 
                                    codecs.includes('ac3') || mime.includes('ac3') || mime.includes('ec-3')) {
                                    rep.parentNode.removeChild(rep);
                                    console.log('[AUDIO] AC-3/E-AC-3 REMOVIDO (kernel safety)');
                                }
                            });
                        } else if (CURRENT_DEVICE === DEVICE_TYPE.SHIELD) {
                            // En Shield: AC-3 es seguro
                            console.log('[AUDIO] Shield detectado. AC-3/E-AC-3 permitido (soportado por kernel)');
                        }

                        // Remover AdaptationSet si quedó sin representaciones
                        if (as.getElementsByTagName('Representation').length === 0) {
                            as.parentNode.removeChild(as);
                            console.log('[AUDIO] AdaptationSet removido (sin representaciones válidas)');
                        }
                    });

                    // ============================================================
                    // Normalización de idioma
                    // ============================================================
                    const allAdaptationSets = Array.from(xmlDoc.getElementsByTagName('AdaptationSet'));
                    allAdaptationSets.forEach(as => {
                        const lang = as.getAttribute('lang');
                        if (!lang || lang.toLowerCase() === 'und') {
                            as.setAttribute('lang', 'es');
                        }
                    });

                    const serializer = new XMLSerializer();
                    const modifiedXml = serializer.serializeToString(xmlDoc);
                    response.data = new TextEncoder().encode(modifiedXml).buffer;
                } catch (err) {
                    console.error('[Manifest Parsing Error]', err);
                }
            };

            return requestInfo;
        };

        // =====================================================================
        // SEGMENT REQUEST HANDLER
        // =====================================================================
        playbackConfig.segmentRequestHandler = (requestInfo) => {
            requestInfo.withCredentials = false;
            if (activeCustomData && activeCustomData.headers) {
                requestInfo.headers = Object.assign({}, requestInfo.headers, activeCustomData.headers);
            }
            return requestInfo;
        };

        // =====================================================================
        // MEDIA PLAYBACK INFO HANDLER - BUFFER DINÁMICO
        // =====================================================================
        
        playerManager.setMediaPlaybackInfoHandler((loadRequestData, config) => {
            activeCustomData = (loadRequestData.media && loadRequestData.media.customData) ? loadRequestData.media.customData : {};
            const contentType = (loadRequestData.media && loadRequestData.media.contentType) ? loadRequestData.media.contentType : '';
            const contentId = (loadRequestData.media && loadRequestData.media.contentId) ? loadRequestData.media.contentId : '';

            isErrorLoopActive = contentId.includes('static_tv.mp4');

            if (contentType.includes('mpegurl') || contentId.includes('.m3u8')) {
                config.shakaConfiguration = null;
                config.playbackPipeline = null;
                return config;
            }

            config.shakaConfiguration = Object.assign({}, playbackConfig.shakaConfiguration);
            config.shakaConfiguration.drm = { clearKeys: {}, servers: {} };

            // ================================================================
            // BUFFER DINÁMICO según tipo de stream
            // ================================================================
            if (currentStreamType === 'live') {
                config.shakaConfiguration.streaming.bufferingGoal = 3;
                config.shakaConfiguration.streaming.rebufferingGoal = 1.5;
                config.shakaConfiguration.streaming.preferLiveSegments = true;
                console.log('[BUFFER] LIVE: 3s/1.5s');
            } else {
                config.shakaConfiguration.streaming.bufferingGoal = 10;
                config.shakaConfiguration.streaming.rebufferingGoal = 4;
                config.shakaConfiguration.streaming.preferLiveSegments = false;
                console.log('[BUFFER] VOD: 10s/4s');
            }

            // ================================================================
            // DRM CONFIGURATION
            // ================================================================
            const hasClearKeys = activeCustomData.clearKeys && 
                                 typeof activeCustomData.clearKeys === 'object' && 
                                 Object.keys(activeCustomData.clearKeys).length > 0;

            if (hasClearKeys) {
                config.shakaConfiguration.drm.preferredKeySystems = ['org.w3.clearkey'];
                for (const [k, v] of Object.entries(activeCustomData.clearKeys)) {
                    if (typeof v === 'string') {
                        const cleanKeyId = k.replace(/[^a-fA-F0-9]/g, '').toLowerCase();
                        const cleanKey = v.replace(/[^a-fA-F0-9]/g, '').toLowerCase();
                        config.shakaConfiguration.drm.clearKeys[cleanKeyId] = cleanKey;
                    }
                }
            } else if (activeCustomData.licenseUrl) {
                config.shakaConfiguration.drm.preferredKeySystems = ['com.widevine.alpha'];
                config.shakaConfiguration.drm.servers['com.widevine.alpha'] = activeCustomData.licenseUrl;
            }

            return config;
        });

        // =====================================================================
        // EVENT LISTENERS
        // =====================================================================
        
        playerManager.addEventListener(cast.framework.events.EventType.ENDED, () => {
            if (isErrorLoopActive) {
                fogLoopRetries++;
                console.log(`[FOG-LOOP] Video terminó. Reinicio #${fogLoopRetries}/${MAX_FOG_LOOP_RETRIES}`);
                
                if (fogLoopRetries <= MAX_FOG_LOOP_RETRIES) {
                    fogLoopTimeout = setTimeout(() => {
                        playerManager.seek(0);
                        playerManager.play();
                    }, 50);
                } else {
                    console.error('[FOG-LOOP] MÁXIMO DE REINTENTOS ALCANZADO. Deteniendo bucle.');
                    isErrorLoopActive = false;
                    notifySenderFatalError('FOG_LOOP_MAX_RETRIES', 9999);
                }
            }
        });

        playerManager.addEventListener(cast.framework.events.EventType.PLAYER_LOAD_COMPLETE, () => {
            const shakaPlayer = playerManager.getShakaPlayer();
            if (shakaPlayer) {
                try {
                    const tracks = shakaPlayer.getVariantTracks();
                    const cleanTracks = tracks.filter(t => {
                        const codec = (t.audioCodec || '').toLowerCase();
                        return !codec.includes('ac-3') && !codec.includes('ec-3') && 
                               !codec.includes('eac3') && !codec.includes('ac3');
                    });
                    if (cleanTracks.length > 0 && cleanTracks.length < tracks.length) {
                        shakaPlayer.selectVariantTrack(cleanTracks[0], false);
                    }
                } catch (e) {
                    console.warn('[Audio Track Filter Warning]', e);
                }

                const netEngine = shakaPlayer.getNetworkingEngine();
                if (netEngine && activeCustomData.clearKeys && Object.keys(activeCustomData.clearKeys).length > 0) {
                    netEngine.registerResponseFilter((type, response) => {
                        if (type === shaka.net.NetworkingEngine.RequestType.LICENSE && activeCustomData.clearKeys) {
                            try {
                                const keysArray = [];
                                for (const [kId, kVal] of Object.entries(activeCustomData.clearKeys)) {
                                    keysArray.push({
                                        kty: 'oct',
                                        kid: hexToBase64Url(kId.replace(/[^a-fA-F0-9]/g, '').toLowerCase()),
                                        k: hexToBase64Url(kVal.replace(/[^a-fA-F0-9]/g, '').toLowerCase())
                                    });
                                }
                                response.data = new TextEncoder().encode(JSON.stringify({ keys: keysArray })).buffer;
                            } catch (e) {
                                console.error('[JWKS Error]', e.message);
                            }
                        }
                    });
                }
            }
        });

        playerManager.addEventListener(cast.framework.events.EventType.ERROR, event => {
            const shakaCode = event.error ? event.error.shakaErrorCode : null;
            
            // ================================================================
            // SI ESTAMOS EN BUCLE DE NIEBLA Y HAY ERROR: REINTENTAR
            // ================================================================
            if (isErrorLoopActive) {
                fogLoopRetries++;
                console.warn(`[FOG-LOOP] Error ${shakaCode} detectado. Reintento #${fogLoopRetries}/${MAX_FOG_LOOP_RETRIES}`);
                
                if (fogLoopRetries <= MAX_FOG_LOOP_RETRIES) {
                    fogLoopTimeout = setTimeout(() => {
                        playerManager.seek(0);
                        playerManager.play();
                    }, 1000);  // Esperar 1 segundo antes de reintentar
                    return;  // NO enviar error fatal si estamos reintentando
                } else {
                    console.error('[FOG-LOOP] MÁXIMO DE REINTENTOS ALCANZADO. Parando.');
                    isErrorLoopActive = false;
                    notifySenderFatalError('FOG_LOOP_MAX_RETRIES', 9999);
                    return;
                }
            }
            
            // ================================================================
            // ERRORES FATALES NORMALES (No en bucle de niebla)
            // ================================================================
            if (shakaCode === 1001 || shakaCode === 6012 || shakaCode === 6007 || shakaCode === 6000) {
                console.warn(`[Fail-Fast] Error irrecuperable (${shakaCode}). Notificando para salto inmediato.`);
                notifySenderFatalError('FATAL_ERROR', shakaCode);
                playerManager.stop();
            }
        });

        context.start({ playbackConfig: playbackConfig });

        // =====================================================================
        // LOGGING DE INICIALIZACIÓN
        // =====================================================================
        console.log(`
