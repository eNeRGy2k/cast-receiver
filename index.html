<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KoreStream Universal Receiver</title>
    <!-- Framework Oficial CAF v3 -->
    <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
</head>
<body style="margin: 0; background: #000; overflow: hidden; width: 100vw; height: 100vh;">

    <cast-media-player></cast-media-player>

    <script>
        const context = cast.framework.CastReceiverContext.getInstance();
        const playerManager = context.getPlayerManager();
        let activeCustomData = {};

        const playbackConfig = new cast.framework.PlaybackConfig();

        // 1. Configuración de Shaka Player optimizada para directos DASH y HLS
        playbackConfig.shakaConfiguration = {
            streaming: {
                jumpLargeGaps: true,
                liveIgnoreNtp: true,
                inaccurateManifestTolerance: 2,
                bufferingGoal: 8,
                rebufferingGoal: 2,
                stallEnabled: true
            },
            manifest: {
                hls: { ignoreTextStreamFailures: true },
                dash: { ignoreMinBufferTime: true, autoCorrectDrift: true }
            }
        };

        // 2. Manejador de configuración dinámica (DRM ClearKey / Widevine)
        playerManager.setMediaPlaybackInfoHandler((loadRequestData, config) => {
            activeCustomData = (loadRequestData.media && loadRequestData.media.customData) ? loadRequestData.media.customData : {};

            config.shakaConfiguration = config.shakaConfiguration || {};
            config.shakaConfiguration.drm = { clearKeys: {}, servers: {}, advanced: {} };

            // Inyección de ClearKeys (pares KID:KEY en hexadecimal estricto)
            if (activeCustomData.clearKeys && typeof activeCustomData.clearKeys === 'object') {
                for (const [keyId, keyVal] of Object.entries(activeCustomData.clearKeys)) {
                    if (typeof keyVal === 'string') {
                        const cleanKeyId = keyId.replace(/[^a-fA-F0-9]/g, '').toLowerCase();
                        const cleanKey = keyVal.replace(/[^a-fA-F0-9]/g, '').toLowerCase();
                        config.shakaConfiguration.drm.clearKeys[cleanKeyId] = cleanKey;
                    }
                }
            }

            // Inyección de Widevine Modular
            if (activeCustomData.licenseServer) {
                config.shakaConfiguration.drm.servers['com.widevine.alpha'] = activeCustomData.licenseServer;

                if (activeCustomData.drmHeaders && typeof activeCustomData.drmHeaders === 'object') {
                    config.shakaConfiguration.drm.advanced['com.widevine.alpha'] = {
                        headers: activeCustomData.drmHeaders
                    };
                }
            }

            return config;
        });

        // 3. Logger de eventos de error
        playerManager.addEventListener(cast.framework.events.EventType.ERROR, event => {
            console.error('CAF Player Error:', event.detailedErrorCode, event.error);
        });

        context.start({ playbackConfig: playbackConfig });
    </script>
</body>
</html>
