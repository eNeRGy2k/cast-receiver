<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KoreStream Universal Receiver</title>
    <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
</head>
<body style="margin: 0; background: #000; overflow: hidden; width: 100vw; height: 100vh;">

    <cast-media-player></cast-media-player>

    <script>
        const context = cast.framework.CastReceiverContext.getInstance();
        const playerManager = context.getPlayerManager();

        const playbackConfig = new cast.framework.PlaybackConfig();

        playbackConfig.shakaConfiguration = {
            streaming: {
                jumpLargeGaps: true,
                liveIgnoreNtp: true,
                inaccurateManifestTolerance: 2,
                bufferingGoal: 8,
                rebufferingGoal: 2,
                stallEnabled: true
            },
            manifest: {
                hls: { ignoreTextStreamFailures: true },
                dash: { 
                    ignoreMinBufferTime: true, 
                    autoCorrectDrift: true,
                    // Desactivar parseo de DRM del manifest si usamos ClearKeys inyectadas
                    ignoreDrmInfo: false
                }
            },
            preferredAudioCodecs: ['mp4a.40.2', 'mp4a'],
            preferredAudioChannelCount: 2,
            preferFewerChannels: true
        };

        // Interceptor de manifiestos y segmentos
        playbackConfig.manifestRequestHandler = requestInfo => {
            requestInfo.withCredentials = false;
            return requestInfo;
        };
        playbackConfig.segmentRequestHandler = playbackConfig.manifestRequestHandler;

        // Interceptor estricto de licencias: bloquea dominios PlayReady inválidos
        playbackConfig.licenseRequestHandler = requestInfo => {
            requestInfo.withCredentials = false;
            const url = requestInfo.url || '';
            if (url.includes('sspplayready') || url.includes('UNSET_LICENSE_URL') || url.includes('VoPlayReady')) {
                // Anular la petición devolviendo un objeto vacío sin conexión de red
                return null;
            }
            return requestInfo;
        };

        // Manejador dinámico de configuración
        playerManager.setMediaPlaybackInfoHandler((loadRequestData, config) => {
            const customData = (loadRequestData.media && loadRequestData.media.customData) ? loadRequestData.media.customData : {};

            config.shakaConfiguration = config.shakaConfiguration || {};
            config.shakaConfiguration.drm = { 
                clearKeys: {}, 
                servers: {}, 
                advanced: {},
                preferredKeySystems: ['org.w3.clearkey', 'com.widevine.alpha']
            };

            const hasClearKeys = customData.clearKeys && typeof customData.clearKeys === 'object' && Object.keys(customData.clearKeys).length > 0;

            if (hasClearKeys) {
                // Si tenemos ClearKeys, forzamos que Shaka ignore otros DRM (como PlayReady en el MPD)
                config.shakaConfiguration.manifest = config.shakaConfiguration.manifest || {};
                config.shakaConfiguration.manifest.dash = config.shakaConfiguration.manifest.dash || {};
                config.shakaConfiguration.manifest.dash.ignoreDrmInfo = true;

                for (const [keyId, keyVal] of Object.entries(customData.clearKeys)) {
                    if (typeof keyVal === 'string') {
                        const cleanKeyId = keyId.replace(/[^a-fA-F0-9]/g, '').toLowerCase();
                        const cleanKey = keyVal.replace(/[^a-fA-F0-9]/g, '').toLowerCase();
                        config.shakaConfiguration.drm.clearKeys[cleanKeyId] = cleanKey;
                    }
                }
            } else if (customData.licenseServer) {
                // Widevine Modular
                config.shakaConfiguration.drm.servers['com.widevine.alpha'] = customData.licenseServer;
                if (customData.drmHeaders && typeof customData.drmHeaders === 'object') {
                    config.shakaConfiguration.drm.advanced['com.widevine.alpha'] = {
                        headers: customData.drmHeaders
                    };
                }
            }

            return config;
        });

        playerManager.addEventListener(cast.framework.events.EventType.ERROR, event => {
            console.error('CAF Player Error:', event.detailedErrorCode, event.error);
        });

        context.start({ playbackConfig: playbackConfig });
    </script>
</body>
</html>
