<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KoreStream Ultra Receiver - v1.0.5</title>
    <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <style>
        #app-version {
            position: absolute;
            top: 12px;
            right: 15px;
            background: rgba(0, 0, 0, 0.75);
            color: #00ffcc;
            font-family: monospace;
            font-size: 14px;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid rgba(0, 255, 204, 0.4);
            z-index: 999999;
            pointer-events: none;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body style="margin: 0; background: #000; overflow: hidden; width: 100vw; height: 100vh;">

    <cast-media-player></cast-media-player>
    <div id="app-version">KoreStream Receiver v1.0.5</div>

    <script>
        const RECEIVER_VERSION = 'v1.0.5';
        const CUSTOM_CHANNEL = 'urn:x-cast:com.equisde.korestream';
        console.log(`[KoreStream] Iniciando Receiver ${RECEIVER_VERSION}`);

        function hexToBase64Url(hexStr) {
            const cleanHex = hexStr.replace(/[^a-fA-F0-9]/g, '');
            const bytes = new Uint8Array(cleanHex.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
            let binary = '';
            for (let i = 0; i < bytes.byteLength; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        function formatKidToUuid(hexKid) {
            const clean = hexKid.replace(/[^a-fA-F0-9]/g, '').toLowerCase();
            if (clean.length !== 32) return hexKid;
            return `${clean.slice(0,8)}-${clean.slice(8,12)}-${clean.slice(12,16)}-${clean.slice(16,20)}-${clean.slice(20)}`;
        }

        const context = cast.framework.CastReceiverContext.getInstance();
        const playerManager = context.getPlayerManager();
        let activeCustomData = {};

        function notifySenderFatalError(reason, code) {
            try {
                context.sendCustomMessage(CUSTOM_CHANNEL, undefined, {
                    type: 'FATAL_ERROR',
                    reason: reason,
                    code: code
                });
            } catch (e) {
                console.warn('[CustomChannel] Error enviando mensaje:', e);
            }
        }

        const playbackConfig = new cast.framework.PlaybackConfig();

        playbackConfig.shakaConfiguration = {
            abr: { enabled: false },
            streaming: {
                jumpLargeGaps: true,
                liveIgnoreNtp: true,
                inaccurateManifestTolerance: 2,
                bufferingGoal: 6,
                rebufferingGoal: 2,
                stallEnabled: true,
                retryParameters: { maxAttempts: 2, timeout: 5000 }
            },
            manifest: {
                hls: { ignoreTextStreamFailures: true, allowInsecureScheme: true },
                dash: { ignoreMinBufferTime: true, autoCorrectDrift: true },
                retryParameters: { maxAttempts: 1, timeout: 4000 }
            },
            drm: {
                clearKeys: {},
                servers: {},
                preferredKeySystems: ['org.w3.clearkey'],
                retryParameters: { maxAttempts: 0 }
            },
            preferredAudioCodecs: ['mp4a.40.2', 'mp4a', 'aac'],
            preferredVideoCodecs: ['avc1', 'h264'],
            preferredAudioChannelCount: 2,
            preferFewerChannels: true
        };

        playbackConfig.manifestRequestHandler = (requestInfo) => {
            requestInfo.withCredentials = false;

            if (activeCustomData && activeCustomData.headers) {
                requestInfo.headers = Object.assign({}, requestInfo.headers, activeCustomData.headers);
            }

            if (!requestInfo.url.includes('.mpd') && !requestInfo.url.includes('dash')) {
                return requestInfo;
            }

            const originalModifyResponse = requestInfo.modifyResponse;
            requestInfo.modifyResponse = (response) => {
                if (originalModifyResponse) originalModifyResponse(response);

                try {
                    const rawXml = new TextDecoder('utf-8').decode(response.data);
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(rawXml, 'application/xml');

                    const mpdNode = xmlDoc.getElementsByTagName('MPD')[0];
                    const firstPeriod = xmlDoc.getElementsByTagName('Period')[0];
                    const periodStart = firstPeriod ? firstPeriod.getAttribute('start') : null;
                    const hasNonZeroPeriodStart = periodStart && periodStart !== 'PT0S' && periodStart !== 'PT0.000S' && periodStart !== '0';

                    // 1. Regla Estricta availabilityStartTime (No romper CMAF / Orange)
                    if (mpdNode) {
                        const ast = mpdNode.getAttribute('availabilityStartTime') || '';
                        const hasAbsoluteTimeline = Array.from(xmlDoc.getElementsByTagName('S')).some(s => {
                            const tVal = parseInt(s.getAttribute('t') || '0', 10);
                            return tVal > 100000;
                        });

                        // Solo recalcular si NO es CMAF con Period start relativo y NO tiene timeline absoluto
                        if (!hasNonZeroPeriodStart && !hasAbsoluteTimeline) {
                            if (ast.startsWith('1970') || ast.startsWith('1900') || ast.startsWith('2015') || !ast) {
                                const pubTimeStr = mpdNode.getAttribute('publishTime');
                                const pubDate = pubTimeStr ? new Date(pubTimeStr) : new Date();
                                const newAst = new Date(pubDate.getTime() - 120000).toISOString();
                                mpdNode.setAttribute('availabilityStartTime', newAst);
                            }
                        }

                        // Ampliación segura de búfer
                        const timeShift = mpdNode.getAttribute('timeShiftBufferDepth') || '';
                        if (timeShift.includes('PT30S') || timeShift.includes('PT22S') || timeShift.includes('PT20S') || timeShift.includes('PT10S')) {
                            mpdNode.setAttribute('timeShiftBufferDepth', 'PT60S');
                        }
                    }

                    // 2. Limpieza de DRM e Inyección ClearKey
                    const clearKeys = activeCustomData.clearKeys || {};
                    const keyIds = Object.keys(clearKeys);
                    const hasClearKeys = keyIds.length > 0;
                    const firstKid = hasClearKeys ? keyIds[0] : null;
                    const uuidKid = firstKid ? formatKidToUuid(firstKid) : null;

                    if (hasClearKeys) {
                        const contentProtections = Array.from(xmlDoc.getElementsByTagName('ContentProtection'));
                        contentProtections.forEach(cp => {
                            const scheme = (cp.getAttribute('schemeIdUri') || '').toLowerCase();
                            if (scheme.includes('edef8ba9') || scheme.includes('9a04f079') || scheme.includes('widevine') || scheme.includes('playready')) {
                                cp.parentNode.removeChild(cp);
                                return;
                            }
                            const psshNodes = cp.getElementsByTagName('cenc:pssh');
                            Array.from(psshNodes).forEach(p => p.parentNode.removeChild(p));
                        });

                        if (uuidKid) {
                            const adaptationSets = xmlDoc.getElementsByTagName('AdaptationSet');
                            Array.from(adaptationSets).forEach(as => {
                                let mp4Prot = Array.from(as.getElementsByTagName('ContentProtection')).find(cp => 
                                    (cp.getAttribute('schemeIdUri') || '').includes('urn:mpeg:dash:mp4protection:2011')
                                );
                                if (!mp4Prot) {
                                    mp4Prot = xmlDoc.createElement('ContentProtection');
                                    mp4Prot.setAttribute('schemeIdUri', 'urn:mpeg:dash:mp4protection:2011');
                                    mp4Prot.setAttribute('value', 'cenc');
                                    as.insertBefore(mp4Prot, as.firstChild);
                                }
                                mp4Prot.setAttribute('cenc:default_KID', uuidKid);
                            });
                        }
                    }

                    // 3. Filtrado de Audio Incompatible (AC3 / EAC3 -> Error 3016)
                    const audioAdaptationSets = Array.from(xmlDoc.getElementsByTagName('AdaptationSet')).filter(as => 
                        (as.getAttribute('contentType') === 'audio' || (as.getAttribute('mimeType') || '').startsWith('audio'))
                    );

                    audioAdaptationSets.forEach(as => {
                        const representations = Array.from(as.getElementsByTagName('Representation'));
                        representations.forEach(rep => {
                            const codecs = (rep.getAttribute('codecs') || '').toLowerCase();
                            const mime = (rep.getAttribute('mimeType') || '').toLowerCase();
                            if (codecs.includes('ac-3') || codecs.includes('ec-3') || codecs.includes('eac3') || codecs.includes('ac3') || mime.includes('ac3') || mime.includes('ec-3')) {
                                rep.parentNode.removeChild(rep);
                            }
                        });
                        if (as.getElementsByTagName('Representation').length === 0) {
                            as.parentNode.removeChild(as);
                        }
                    });

                    // 4. Normalización de Idioma
                    const allAdaptationSets = Array.from(xmlDoc.getElementsByTagName('AdaptationSet'));
                    allAdaptationSets.forEach(as => {
                        const lang = as.getAttribute('lang');
                        if (!lang || lang.toLowerCase() === 'und') {
                            as.setAttribute('lang', 'es');
                        }
                    });

                    const serializer = new XMLSerializer();
                    const modifiedXml = serializer.serializeToString(xmlDoc);
                    response.data = new TextEncoder().encode(modifiedXml).buffer;
                } catch (err) {
                    console.error('[Manifest Parsing Error]', err);
                }
            };

            return requestInfo;
        };

        playbackConfig.segmentRequestHandler = (requestInfo) => {
            requestInfo.withCredentials = false;
            if (activeCustomData && activeCustomData.headers) {
                requestInfo.headers = Object.assign({}, requestInfo.headers, activeCustomData.headers);
            }
            return requestInfo;
        };

        playerManager.setMediaPlaybackInfoHandler((loadRequestData, config) => {
            activeCustomData = (loadRequestData.media && loadRequestData.media.customData) ? loadRequestData.media.customData : {};
            const contentType = (loadRequestData.media && loadRequestData.media.contentType) ? loadRequestData.media.contentType : '';
            const contentId = (loadRequestData.media && loadRequestData.media.contentId) ? loadRequestData.media.contentId : '';

            // HLS Nativo
            if (contentType.includes('mpegurl') || contentId.includes('.m3u8')) {
                config.shakaConfiguration = null;
                config.playbackPipeline = null;
                return config;
            }

            // DASH ClearKey
            config.shakaConfiguration = Object.assign({}, playbackConfig.shakaConfiguration);
            config.shakaConfiguration.drm = {
                clearKeys: {},
                servers: {},
                preferredKeySystems: ['org.w3.clearkey'],
                retryParameters: { maxAttempts: 0 }
            };

            if (activeCustomData.clearKeys && typeof activeCustomData.clearKeys === 'object') {
                for (const [k, v] of Object.entries(activeCustomData.clearKeys)) {
                    if (typeof v === 'string') {
                        const cleanKeyId = k.replace(/[^a-fA-F0-9]/g, '').toLowerCase();
                        const cleanKey = v.replace(/[^a-fA-F0-9]/g, '').toLowerCase();
                        config.shakaConfiguration.drm.clearKeys[cleanKeyId] = cleanKey;
                    }
                }
            }

            return config;
        });

        playerManager.addEventListener(cast.framework.events.EventType.PLAYER_LOAD_COMPLETE, () => {
            const shakaPlayer = playerManager.getShakaPlayer();
            if (shakaPlayer) {
                try {
                    const tracks = shakaPlayer.getVariantTracks();
                    const cleanTracks = tracks.filter(t => {
                        const codec = (t.audioCodec || '').toLowerCase();
                        return !codec.includes('ac-3') && !codec.includes('ec-3') && !codec.includes('eac3') && !codec.includes('ac3');
                    });
                    if (cleanTracks.length > 0 && cleanTracks.length < tracks.length) {
                        shakaPlayer.selectVariantTrack(cleanTracks[0], false);
                    }
                } catch (e) {
                    console.warn('[Audio Track Filter Warning]', e);
                }

                const netEngine = shakaPlayer.getNetworkingEngine();
                if (netEngine) {
                    netEngine.registerResponseFilter((type, response) => {
                        if (type === shaka.net.NetworkingEngine.RequestType.LICENSE && activeCustomData.clearKeys) {
                            try {
                                const keysArray = [];
                                for (const [kId, kVal] of Object.entries(activeCustomData.clearKeys)) {
                                    keysArray.push({
                                        kty: 'oct',
                                        kid: hexToBase64Url(kId.replace(/[^a-fA-F0-9]/g, '').toLowerCase()),
                                        k: hexToBase64Url(kVal.replace(/[^a-fA-F0-9]/g, '').toLowerCase())
                                    });
                                }
                                response.data = new TextEncoder().encode(JSON.stringify({ keys: keysArray })).buffer;
                            } catch (e) {
                                console.error('[JWKS Error]', e.message);
                            }
                        }
                    });
                }
            }
        });

        playerManager.addEventListener(cast.framework.events.EventType.ERROR, event => {
            const shakaCode = event.error ? event.error.shakaErrorCode : null;
            if (shakaCode === 1001 || shakaCode === 6012 || shakaCode === 6007) {
                console.warn(`[Fail-Fast] Error irrecuperable (${shakaCode}). Notificando salto inmediato.`);
                notifySenderFatalError('FATAL_ERROR', shakaCode);
                playerManager.stop();
            }
        });

        context.start({ playbackConfig: playbackConfig });
    </script>
</body>
</html>
