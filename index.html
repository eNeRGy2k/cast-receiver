<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KoreStream Universal Receiver</title>
    <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
</head>
<body style="margin: 0; background: #000; overflow: hidden; width: 100vw; height: 100vh;">

    <cast-media-player></cast-media-player>

    <script>
        const context = cast.framework.CastReceiverContext.getInstance();
        const playerManager = context.getPlayerManager();
        let activeCustomData = {};

        const playbackConfig = new cast.framework.PlaybackConfig();

        playbackConfig.shakaConfiguration = {
            abr: {
                enabled: false // Evita peticiones simultáneas abortadas en el proxy local
            },
            streaming: {
                jumpLargeGaps: true,
                liveIgnoreNtp: true,
                inaccurateManifestTolerance: 2,
                bufferingGoal: 6,
                rebufferingGoal: 2,
                stallEnabled: true
            },
            manifest: {
                hls: { ignoreTextStreamFailures: true },
                dash: { 
                    ignoreMinBufferTime: true, 
                    autoCorrectDrift: true
                }
            },
            preferredAudioCodecs: ['mp4a.40.2', 'mp4a'],
            preferredAudioChannelCount: 2,
            preferFewerChannels: true
        };

        playbackConfig.manifestRequestHandler = requestInfo => {
            requestInfo.withCredentials = false;
            return requestInfo;
        };
        playbackConfig.segmentRequestHandler = playbackConfig.manifestRequestHandler;

        // 1. Limpiador y Parcheador Quirúrgico de MPD
        playbackConfig.manifestHandler = (manifestText, requestInfo) => {
            if (!manifestText) return manifestText;

            const hasClearKeys = activeCustomData.clearKeys && 
                                 typeof activeCustomData.clearKeys === 'object' && 
                                 Object.keys(activeCustomData.clearKeys).length > 0;

            if (hasClearKeys) {
                try {
                    // Purgar todos los ContentProtection de PlayReady, Widevine y otros esquemas propietarios
                    manifestText = manifestText.replace(/<ContentProtection[^>]*schemeIdUri=["'](?!urn:mpeg:dash:mp4protection:2011|urn:uuid:e2719d58-a985-b3c9-781a-b030e4d41410)[^"']+["'][^>]*>[\s\S]*?<\/ContentProtection>/gi, '');
                    manifestText = manifestText.replace(/<ContentProtection[^>]*schemeIdUri=["'](?!urn:mpeg:dash:mp4protection:2011|urn:uuid:e2719d58-a985-b3c9-781a-b030e4d41410)[^"']+\/>/gi, '');

                    // Inyección de default_KID si falta
                    if (!manifestText.includes('default_KID')) {
                        const firstKidHex = Object.keys(activeCustomData.clearKeys)[0].replace(/[^a-fA-F0-9]/g, '');
                        if (firstKidHex.length === 32) {
                            const kidUuid = firstKidHex.replace(/(.{8})(.{4})(.{4})(.{4})(.{12})/, '$1-$2-$3-$4-$5').toLowerCase();
                            manifestText = manifestText.replace(
                                /schemeIdUri=["']urn:mpeg:dash:mp4protection:2011["']/gi,
                                `schemeIdUri="urn:mpeg:dash:mp4protection:2011" default_KID="${kidUuid}"`
                            );
                        }
                    }
                } catch (e) {
                    console.warn('Error en manifestHandler:', e);
                }
            }
            return manifestText;
        };

        // 2. Configuración DRM dinámica
        playerManager.setMediaPlaybackInfoHandler((loadRequestData, config) => {
            activeCustomData = (loadRequestData.media && loadRequestData.media.customData) ? loadRequestData.media.customData : {};

            config.shakaConfiguration = config.shakaConfiguration || {};
            config.shakaConfiguration.drm = { 
                clearKeys: {}, 
                servers: {}, 
                advanced: {} 
            };

            const hasClearKeys = activeCustomData.clearKeys && 
                                 typeof activeCustomData.clearKeys === 'object' && 
                                 Object.keys(activeCustomData.clearKeys).length > 0;

            if (hasClearKeys) {
                config.shakaConfiguration.drm.preferredKeySystems = ['org.w3.clearkey'];
                for (const [keyId, keyVal] of Object.entries(activeCustomData.clearKeys)) {
                    if (typeof keyVal === 'string') {
                        const cleanKeyId = keyId.replace(/[^a-fA-F0-9]/g, '').toLowerCase();
                        const cleanKey = keyVal.replace(/[^a-fA-F0-9]/g, '').toLowerCase();
                        config.shakaConfiguration.drm.clearKeys[cleanKeyId] = cleanKey;
                    }
                }
            } else if (activeCustomData.licenseServer) {
                config.shakaConfiguration.drm.preferredKeySystems = ['com.widevine.alpha'];
                config.shakaConfiguration.drm.servers['com.widevine.alpha'] = activeCustomData.licenseServer;
                if (activeCustomData.drmHeaders && typeof activeCustomData.drmHeaders === 'object') {
                    config.shakaConfiguration.drm.advanced['com.widevine.alpha'] = {
                        headers: activeCustomData.drmHeaders
                    };
                }
            }

            return config;
        });

        // 3. Audio seguro y protección de sesión
        playerManager.addEventListener(cast.framework.events.EventType.PLAYER_LOAD_COMPLETE, () => {
            const shakaPlayer = playerManager.getShakaPlayer();
            if (shakaPlayer) {
                try {
                    const tracks = shakaPlayer.getVariantTracks();
                    const safeTracks = tracks.filter(t => {
                        const codec = (t.audioCodec || '').toLowerCase();
                        return !codec.includes('ac-3') && !codec.includes('ec-3') && !codec.includes('eac3') && !codec.includes('ac3');
                    });

                    if (safeTracks.length > 0) {
                        shakaPlayer.selectVariantTrack(safeTracks[0], false);
                    }
                } catch (e) {
                    console.warn('Audio selection error:', e);
                }
            }
        });

        playerManager.addEventListener(cast.framework.events.EventType.ERROR, event => {
            console.error('CAF Player Error:', event.detailedErrorCode, event.error);
        });

        context.start({ playbackConfig: playbackConfig });
    </script>
</body>
</html>
