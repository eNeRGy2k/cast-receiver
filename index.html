<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KoreStream Universal Receiver</title>
    <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
</head>
<body style="margin: 0; background: #000; overflow: hidden; width: 100vw; height: 100vh;">

    <cast-media-player></cast-media-player>

    <script>
        const context = cast.framework.CastReceiverContext.getInstance();
        const playerManager = context.getPlayerManager();
        let activeCustomData = {};

        const playbackConfig = new cast.framework.PlaybackConfig();

        // 1. Configuración de Shaka Player para directos
        playbackConfig.shakaConfiguration = {
            streaming: {
                jumpLargeGaps: true,
                liveIgnoreNtp: true,
                bufferingGoal: 10,
                rebufferingGoal: 2
            }
        };

        // 2. Interceptores de red CAF
        playbackConfig.manifestRequestHandler = requestInfo => {
            requestInfo.withCredentials = true;
            requestInfo.headers = requestInfo.headers || {};
            applyHeaders(requestInfo.headers, activeCustomData);
        };
        playbackConfig.segmentRequestHandler = playbackConfig.manifestRequestHandler;
        playbackConfig.licenseRequestHandler = playbackConfig.manifestRequestHandler;

        // 3. Manejador dinámico de configuración (CORRECCIÓN CLAVE)
        playerManager.setMediaPlaybackInfoHandler((loadRequestData, config) => {
            const customData = loadRequestData.media.customData || {};
            activeCustomData = customData;

            config.shakaConfiguration = config.shakaConfiguration || {};
            config.shakaConfiguration.drm = config.shakaConfiguration.drm || {};

            // A) Configuración de ClearKeys
            if (customData.clearKeys && typeof customData.clearKeys === 'object') {
                config.shakaConfiguration.drm.clearKeys = customData.clearKeys;
            }

            // B) Configuración de Widevine
            if (customData.licenseServer) {
                config.shakaConfiguration.drm.servers = config.shakaConfiguration.drm.servers || {};
                config.shakaConfiguration.drm.servers['com.widevine.alpha'] = customData.licenseServer;

                if (customData.drmHeaders && typeof customData.drmHeaders === 'object') {
                    config.shakaConfiguration.drm.advanced = config.shakaConfiguration.drm.advanced || {};
                    config.shakaConfiguration.drm.advanced['com.widevine.alpha'] = {
                        headers: customData.drmHeaders
                    };
                }
            }
            return config;
        });

        // Función auxiliar para inyectar cabeceras
        function applyHeaders(targetHeaders, sourceData) {
            if (!targetHeaders || !sourceData) return;

            if (sourceData.headers) {
                Object.assign(targetHeaders, sourceData.headers);
            }
            if (sourceData.referer) {
                targetHeaders['Referer'] = sourceData.referer;
            }
            if (sourceData.userAgent) {
                targetHeaders['X-User-Agent'] = sourceData.userAgent;
            }
        }

        // 4. Filtro de red persistente de Shaka (para redirects)
        playerManager.addEventListener(cast.framework.events.EventType.PLAYER_LOAD_COMPLETE, () => {
            const shakaPlayer = playerManager.getShakaPlayer();
            if (shakaPlayer) {
                shakaPlayer.getNetworkingEngine().registerRequestFilter((type, request) => {
                    request.allowCrossSiteCredentials = true;
                    applyHeaders(request.headers, activeCustomData);
                });
            }
        });

        context.start({ playbackConfig: playbackConfig });
    </script>
</body>
</html>
