<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KoreStream Universal Receiver</title>
    <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
</head>
<body style="margin: 0; background: #000; overflow: hidden; width: 100vw; height: 100vh;">

    <cast-media-player></cast-media-player>

    <script>
        const context = cast.framework.CastReceiverContext.getInstance();
        const playerManager = context.getPlayerManager();

        const playbackConfig = new cast.framework.PlaybackConfig();

        playbackConfig.shakaConfiguration = {
            streaming: {
                jumpLargeGaps: true,
                liveIgnoreNtp: true,
                inaccurateManifestTolerance: 2,
                bufferingGoal: 8,
                rebufferingGoal: 2,
                stallEnabled: true
            },
            manifest: {
                hls: { ignoreTextStreamFailures: true },
                dash: { 
                    ignoreMinBufferTime: true, 
                    autoCorrectDrift: true,
                    // Descartar esquemas DRM no soportados para no llamar licencias fantasma
                    ignoreDrmInfo: false
                }
            },
            // Forzar codec de audio AAC (mp4a) para evitar el crash del decodificador Dolby
            preferredAudioCodecs: ['mp4a.40.2', 'mp4a'],
            preferredAudioChannelCount: 2,
            preferFewerChannels: true
        };

        playbackConfig.manifestRequestHandler = requestInfo => {
            requestInfo.withCredentials = false;
            if (requestInfo.url && (requestInfo.url.includes('UNSET_LICENSE_URL') || requestInfo.url.includes('VoPlayReadyAquireLicense'))) {
                return null;
            }
            return requestInfo;
        };
        playbackConfig.segmentRequestHandler = playbackConfig.manifestRequestHandler;
        playbackConfig.licenseRequestHandler = playbackConfig.manifestRequestHandler;

        playerManager.setMediaPlaybackInfoHandler((loadRequestData, config) => {
            const customData = (loadRequestData.media && loadRequestData.media.customData) ? loadRequestData.media.customData : {};

            config.shakaConfiguration = config.shakaConfiguration || {};
            config.shakaConfiguration.drm = { 
                clearKeys: {}, 
                servers: {}, 
                advanced: {},
                preferredKeySystems: ['org.w3.clearkey', 'com.widevine.alpha']
            };

            // Inyección de ClearKeys
            if (customData.clearKeys && typeof customData.clearKeys === 'object') {
                for (const [keyId, keyVal] of Object.entries(customData.clearKeys)) {
                    if (typeof keyVal === 'string') {
                        const cleanKeyId = keyId.replace(/[^a-fA-F0-9]/g, '').toLowerCase();
                        const cleanKey = keyVal.replace(/[^a-fA-F0-9]/g, '').toLowerCase();
                        config.shakaConfiguration.drm.clearKeys[cleanKeyId] = cleanKey;
                    }
                }
            }

            // Inyección de Widevine
            if (customData.licenseServer) {
                config.shakaConfiguration.drm.servers['com.widevine.alpha'] = customData.licenseServer;
            }

            return config;
        });

        // Interceptar selección de pistas de Shaka para descartar EC-3 / AC-3 antes de reproducir
        playerManager.addEventListener(cast.framework.events.EventType.PLAYER_LOAD_COMPLETE, () => {
            const shakaPlayer = playerManager.getShakaPlayer();
            if (shakaPlayer) {
                const audioTracks = shakaPlayer.getVariantTracks().filter(t => t.audioCodec && !t.audioCodec.includes('ac-3') && !t.audioCodec.includes('ec-3'));
                if (audioTracks.length > 0) {
                    shakaPlayer.selectAudioLanguage(audioTracks[0].language);
                }
            }
        });

        playerManager.addEventListener(cast.framework.events.EventType.ERROR, event => {
            console.error('CAF Player Error:', event.detailedErrorCode, event.error);
        });

        context.start({ playbackConfig: playbackConfig });
    </script>
</body>
</html>
